name: Generate self-hosted GitHub profile cards

on:
  schedule:
    - cron: "0 7 * * *" # Daily at 07:00 Asia/Kolkata
      timezone: "Asia/Kolkata"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-main-writers
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Render profile analytics SVG cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: lio-dinesh
          cards: overview,contributions,momentum,languages
          output-dir: assets/profile-cards
          themes: light,dark
          palette: blue
          commit: true
          commit-message: "chore(profile): refresh self-hosted analytics cards [skip ci]"
