name: Update Monkeytype profile cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monkeytype-readme.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monkeytype-profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Generate Monkeytype README SVGs
        uses: monkeytype-hub/monkeytype-readme@v1.0.0
        with:
          username: lio_dinesh
          themes: serika_dark
          target-branch: monkeytype-readme
          github-token: ${{ secrets.GITHUB_TOKEN }}
