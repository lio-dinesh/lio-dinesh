name: Generate 3D practice streak matrix

on:
  schedule:
    - cron: "20 2 * * *" # 07:50 Asia/Kolkata
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/generate-practice-streaks.mjs"
      - ".github/workflows/practice-streaks.yml"

permissions:
  contents: write

concurrency:
  group: profile-main-writers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate 3D platform streak matrix
        run: node scripts/generate-practice-streaks.mjs
        env:
          MONKEYTYPE_API_KEY: ${{ secrets.MONKEYTYPE_API_KEY }}

      - name: Commit refreshed SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/practice-streaks.svg
          if git diff --cached --quiet; then
            echo "Practice streak graphic is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh 3D practice streak matrix [skip ci]"
          git push
