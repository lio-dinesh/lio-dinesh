name: Generate 3D practice streak matrix

on:
  schedule:
    - cron: "50 7 * * *" # Daily at 07:50 Asia/Kolkata
      timezone: "Asia/Kolkata"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-practice-streaks.mjs"
permissions:
  contents: write

concurrency:
  group: profile-main-writers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate 3D platform streak matrix
        run: node scripts/generate-practice-streaks.mjs
        env:
          MONKEYTYPE_API_KEY: ${{ secrets.MONKEYTYPE_API_KEY }}

      - name: Commit refreshed SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/practice-streaks.svg
          if git diff --cached --quiet; then
            echo "Practice streak graphic is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh 3D practice streak matrix [skip ci]"

          # If another profile job or a manual README edit reaches main first,
          # re-stage the generated SVG on the newest main and retry safely.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              break
            fi

            echo "Push rejected; refreshing main and retrying (attempt $attempt)."
            git fetch origin main
            git reset --mixed origin/main
            git add assets/practice-streaks.svg

            if git diff --cached --quiet; then
              echo "The latest main already has the generated practice dashboard."
              pushed=true
              break
            fi

            git commit -m "chore(profile): refresh 3D practice streak matrix [skip ci]"
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Could not push the daily practice dashboard after 3 attempts."
            exit 1
          fi
